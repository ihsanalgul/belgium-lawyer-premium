[build]
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from = "/blog"
  to = "/blog/"
  status = 301

[[redirects]]
  from = "/admin"
  to = "/admin/"
  status = 301

# Decap CMS — ensure config is served
[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
